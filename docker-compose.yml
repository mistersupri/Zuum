# Local/staging stack. Production: run LiveKit on hosts with public IPs and TURN,
# use managed Postgres/Redis/S3, and put TLS in front of web + LiveKit.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: zuum, POSTGRES_PASSWORD: zuum, POSTGRES_DB: zuum }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U zuum"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine

  livekit:
    image: livekit/livekit-server:v1.13
    command: --config /etc/livekit.yaml
    volumes: [./infra/livekit.compose.yaml:/etc/livekit.yaml:ro]
    ports: ["7880:7880", "7881:7881", "50000-50100:50000-50100/udp"]
    depends_on: [redis]

  # Server-side recording (composite + per-track audio). Needs the same API key/secret.
  egress:
    image: livekit/egress:v1.10
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://livekit:7880
        redis: { address: redis:6379 }
    cap_add: [SYS_ADMIN]
    depends_on: [livekit, redis]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: zuum, MINIO_ROOT_PASSWORD: zuum-secret-key }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  migrate:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, args: { APP: api } }
    working_dir: /repo/packages/db
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env
    environment: { DATABASE_URL: "postgresql://zuum:zuum@postgres:5432/zuum" }
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, args: { APP: api } }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://zuum:zuum@postgres:5432/zuum
      REDIS_URL: redis://redis:6379
      LIVEKIT_API_URL: http://livekit:7880
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: zuum
      S3_SECRET_ACCESS_KEY: zuum-secret-key
      S3_FORCE_PATH_STYLE: "true"
      TRUST_PROXY: "true"
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }

  worker:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, args: { APP: worker } }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://zuum:zuum@postgres:5432/zuum
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ws://livekit:7880
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
