# Serves the SPA and proxies the API on the same origin, so the refresh cookie
# (SameSite=Strict) and SSE work without cross-origin setup.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-48OlH8FOVFh73z5cxDg6bno5dUlOSbzUvRv9+hV9ieY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss: https:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE: no buffering, long reads.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
